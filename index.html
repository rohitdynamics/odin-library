<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-left-text">The Odin Library</div>
        <button id="addbookbtn">BUTTON</button>
    </header>
    <div class="library">
    </div>
    <dialog id="addbookdialog">
        <button id="closedialogbtn">Close</button>
            <form id="addbookform">
                <label for="title">Book name</label>
                <input type="text" id="title" name="title" placeholder="The Witcher"/>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" placeholder="A. Sapkowski"/>
                <label for="title">No of pages in book</label>
                <input type="text" id="pages" name="pages" placeholder="594"/>
                <div id="markasread-div">
                <label for="title">Mark as read</label>
                <input type="checkbox" id="readstatus" name="readstatus"/>
                </div>
                <button type =submit id="submitbookbtn">Submit</button>
            </form>
        </dialog>
    <footer></footer>
</body>
</html>
